name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOVULNCHECK_VERSION: v1.9.0
  STATICCHECK_VERSION: v0.8.2

jobs:
  lint:
    # Fork PRs stay on hosted runners: untrusted code must not reach the self-hosted pool.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-lint-${{ runner.os }}-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: go-lint-${{ runner.os }}-

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}" ./...
      - name: go mod tidy
        run: go mod tidy -diff
      - name: govulncheck
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: wa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d wa"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_POSTGRES_URL: postgres://postgres:pw@localhost:5432/wa?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-test-${{ runner.os }}-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: go-test-${{ runner.os }}-

      - name: go test (SQLite and Postgres, race detector)
        run: |
          set -o pipefail
          go test -race -count=1 -v ./... 2>&1 | tee test.log
      - name: Postgres tests actually ran
        run: |
          if grep -E -- '--- SKIP: [^ ]+/postgres' test.log; then
            echo "::error::Postgres store tests were skipped; is the service reachable?"; exit 1
          fi
          passed=$(grep -cE -- '--- PASS: [^ ]+/postgres( |$)' test.log || true)
          echo "Postgres subtests passed: $passed"
          [ "$passed" -gt 0 ]

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: go-build-${{ runner.os }}-

      - name: Build static binary
        run: make build
      - name: Binary is CGO-free
        run: go version -m bin/whatsapp-mcp | grep -q 'CGO_ENABLED=0'

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Dockerfile checks
        run: docker build --check --build-arg BUILDKIT_DOCKERFILE_CHECK=error=true .
      - name: Build image for amd64 and arm64
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --output type=cacheonly \
            --build-arg VERSION="${GITHUB_SHA::7}" --build-arg REVISION="$GITHUB_SHA" .

  # Starts compose.yaml as a user would and checks the server runs against
  # Postgres. It cannot pair, so it stops at a waiting QR code; that needs
  # WhatsApp's servers to be reachable from the runner.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start the stack
        run: |
          (umask 077; printf 'WHATSAPP_MCP_TOKEN=%s\nPOSTGRES_PASSWORD=%s\n' \
            "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" > .env)
          docker compose up -d --build --wait --wait-timeout 300
      - name: Server is healthy and serves a pairing code
        run: |
          curl -fsS http://127.0.0.1:8080/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/pair)" = 401
          # The QR code follows the connection by a moment.
          for _ in $(seq 30); do
            if sed -n 's/^WHATSAPP_MCP_TOKEN=/Authorization: Bearer /p' .env \
                | curl -fsS -H @- -o pair.png http://127.0.0.1:8080/pair; then
              break
            fi
            sleep 1
          done
          file pair.png | grep -q 'PNG image'
      - name: Session store and archive are in Postgres
        run: |
          tables=$(docker compose exec -T postgres psql -U whatsapp -d whatsapp -tAc \
            "SELECT count(*) FROM information_schema.tables WHERE table_name IN ('whatsmeow_device', 'messages')")
          [ "$tables" = 2 ]
      - name: Logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v
